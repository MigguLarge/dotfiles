include ./themes/rose-pine.conf
# include ./dark_background.conf

include ./map.conf

window_padding_width 16
hide_window_decorations titlebar-only
allow_remote_control yes
confirm_os_window_close 0

font_family DepartureMono Nerd Font
# font_family Jetbrains Mono NL
# font_family D2Coding
# font_family Victor Mono
bold_font auto
italic_font auto
bold_italic_font auto
symbol_map U+AC00-U+D7A3 D2Coding
font_size 16.0

# cursor #ffffff

background_opacity 0.90
background_blur 48
